contract_version: "1.0"
production_handoff:
  project:
    market: JP
    channel: amazon-jp
    locale: ja-JP
    product: Example Product

  listing_family:
    parent_listing_id: parent
    variations:
      - variation_id: black
        label: ブラック
        attributes:
          color: ブラック

  page_plan:
    gallery:
      - G1
      - G2
    enhanced_content:
      - A1
    other_required_regions: []

  asset_set:
    - asset_id: G1
      region: gallery
      slot: gallery-1
      shopper_task: Recognize the product and core positioning quickly
      primary_message: Core positioning
      user_value: Understand why the product is worth considering
      usage_scene: Product-first neutral stage
      proof_object: Exact product identity
      evidence_mode: SOURCE_FAITHFUL
      creative_role: HERO_POSITIONING
      media_type: image
      variation_id: null
    - asset_id: G2
      region: gallery
      slot: gallery-2
      shopper_task: Understand the primary differentiator
      primary_message: Primary proof
      user_value: See a concrete reason to choose the product
      usage_scene: Evidence-backed use environment
      proof_object: Direct differentiator proof
      evidence_mode: PROOF_VISUAL
      creative_role: DIFFERENTIATOR_PROOF
      media_type: image
      variation_id: black
    - asset_id: A1
      region: a-plus
      slot: a-plus-1
      shopper_task: Understand how the product creates value in use
      primary_message: Expanded lifestyle explanation
      user_value: Connect the feature to a believable daily outcome
      usage_scene: Evidence-backed Japanese home situation
      proof_object: Situation plus product intervention
      evidence_mode: CREATIVE_MOCK
      creative_role: LIFESTYLE_USE_CASE
      media_type: image
      variation_id: null

  source_assets:
    - source_id: SRC-P01
      role: real-product-source
      required_by:
        - G1
        - G2
        - A1

  product_invariants:
    - preserve exact product geometry
    - preserve exact product color and material

  creative_strategy_ref: creative-strategy.yaml

  global_visual_direction:
    - product-first commercial hierarchy
    - realistic environment when a scene is needed
    - same art direction does not imply the same composition

  page_visual_system:
    asset_directions:
      - asset_id: G1
        visual_role: hero-positioning
        scene_family: clean-product-stage
        composition_family: centered-hero
        tone: bright-neutral
        product_scale: large
        proof_form: source-faithful-product
      - asset_id: G2
        visual_role: differentiator-proof
        scene_family: technical-detail
        composition_family: close-up-explainer
        tone: neutral-technical
        product_scale: close-up
        proof_form: mechanism
      - asset_id: A1
        visual_role: lifestyle-use
        scene_family: realistic-home
        composition_family: wide-lifestyle
        tone: warm-natural
        product_scale: medium
        proof_form: lifestyle

  visual_benchmark_refs:
    - BENCH-01

  prohibited:
    - unsupported claims
    - invented product structure
    - automatic cross-role asset substitution

  blocked_assets: []
