name: Check Amazon Japan Creative Workflow Governance

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch live branch and detailed ruleset snapshots
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${REPO}/branches/main" > /tmp/main-branch.json
          gh api "repos/${REPO}/rulesets" > /tmp/rulesets-list.json
          {
            for id in $(jq -r '.[].id' /tmp/rulesets-list.json); do
              gh api "repos/${REPO}/rulesets/${id}"
            done
          } | jq -s '.' > /tmp/rulesets.json
      - name: Report strict governance state
        shell: bash
        run: |
          set +e
          python3 scripts/check_github_governance.py /tmp/main-branch.json /tmp/rulesets.json
          code=$?
          if [ "$code" -eq 0 ]; then
            exit 0
          fi
          echo "Governance is not yet PASS. A valid release ruleset must be Active, target main, require PRs, require the validate check from GitHub Actions app 15368, block force pushes, and block deletion."
          exit "$code"
