name: Validate Amazon Japan Creative Workflow M5.1

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install baseline verification dependency
        run: python3 -m pip install --disable-pip-version-check --no-input Pillow
      - run: python3 scripts/selftest_provenance.py
      - run: python3 .agents/skills/amazon-japan-creative-workflow/scripts/selftest_router.py
      - run: python3 .agents/skills/listing-strategy/scripts/selftest_strategy.py
      - run: python3 .agents/skills/listing-strategy/scripts/selftest_strategy_v010.py
      - run: python3 .agents/skills/creative-production/scripts/selftest_creative_brief.py
      - run: python3 .agents/skills/creative-production/scripts/selftest_production.py
      - run: python3 .agents/skills/creative-production/scripts/selftest_creative_state.py
      - run: python3 .agents/skills/creative-quality/scripts/selftest_asset_quality.py
      - run: python3 .agents/skills/creative-quality/scripts/selftest_set_quality.py
      - run: python3 .agents/skills/creative-quality/scripts/selftest_diagnosis.py
      - run: python3 .agents/skills/listing-simulator-bridge/scripts/selftest_contract.py
      - run: python3 .agents/skills/listing-simulator-bridge/scripts/selftest_variations.py
      - run: python3 .agents/skills/listing-simulator-bridge/scripts/selftest_import_pack.py
      - run: python3 .agents/skills/listing-simulator-bridge/scripts/selftest_pack_security.py
      - run: python3 .agents/skills/listing-evidence-auditor/scripts/selftest_auditor.py
      - run: python3 .agents/skills/listing-hardening/scripts/selftest_hardening.py
      - run: python3 .agents/skills/evidence-hardening/scripts/selftest_final_eligibility.py
      - run: python3 scripts/selftest_release_packaging.py
      - run: python3 scripts/selftest_release_reliability.py
      - run: python3 scripts/validate_agent_pressure_evals.py
      - run: python3 scripts/selftest_agent_pressure_results.py
      - name: Parse machine-readable contracts and fixtures
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in [
              "contracts/creative-brief.schema.json",
              "contracts/strategy-output.schema.json",
              "contracts/creative-quality.schema.json",
              "contracts/set-quality.schema.json",
              "contracts/asset-binding.schema.json",
              "contracts/simulator-manifest.schema.json",
              "contracts/final-eligibility.schema.json",
              "contracts/release-manifest.schema.json",
              "profiles/amazon-jp/slot-taxonomy.json",
              ".agents/skills/listing-simulator-bridge/templates/template-registry.synthetic.json",
              "fixtures/adversarial/manifest.json",
              "evals/agent-pressure/manifest.json",
          ]:
              json.loads(Path(path).read_text(encoding="utf-8"))
          print("PASS: M5.1 JSON contracts parse")
          PY
      - name: Verify deterministic Simulator ZIP and validation
        shell: bash
        run: |
          set -euo pipefail
          python3 .agents/skills/listing-simulator-bridge/scripts/build_import_pack.py fixtures/simulator-import/parent-only /tmp/pack-a.zip
          python3 .agents/skills/listing-simulator-bridge/scripts/build_import_pack.py fixtures/simulator-import/parent-only /tmp/pack-b.zip
          A="$(sha256sum /tmp/pack-a.zip | awk '{print $1}')"
          B="$(sha256sum /tmp/pack-b.zip | awk '{print $1}')"
          test "$A" = "$B"
          python3 .agents/skills/listing-simulator-bridge/scripts/validate_import_pack.py /tmp/pack-a.zip
      - name: Build and independently validate M5.1 release candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/package_release.py --source-commit "$GITHUB_SHA" --output-dir /tmp/m51-release
          python3 scripts/validate_release.py /tmp/m51-release
